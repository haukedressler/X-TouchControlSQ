name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: "App version (top left in the app)", placeholder: "0.10.2" }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: "System", options: ["macOS", "Windows (installer)", "Windows (portable)"] }
    validations: { required: true }
  - type: input
    id: console
    attributes: { label: "Console model and firmware", placeholder: "SQ5, 1.6.4" }
  - type: textarea
    id: what
    attributes: { label: "What happened?", description: "Steps to reproduce" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "What did you expect?" }
  - type: textarea
    id: log
    attributes: { label: "Log (app menu › Open log folder)", render: text }

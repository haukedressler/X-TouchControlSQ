name: "🐞 Fehler melden · Report a bug"
description: "Etwas funktioniert nicht wie erwartet · Something does not work as expected"
labels: [bug]
body:
  - type: markdown
    attributes: { value: "Bitte keine privaten Daten (Passwörter, persönliche Pfade, IP-Adressen) mitschicken – alles hier ist öffentlich lesbar.<br>*Please do not include private data (passwords, personal paths, IP addresses) – everything here is public.*" }
  - type: input
    id: version
    attributes: { label: "App-Version · version", placeholder: "0.73.9" }
    validations: { required: true }
  - type: input
    id: system
    attributes: { label: "System", placeholder: "macOS 15.2 / Windows 11" }
    validations: { required: true }
  - type: input
    id: console
    attributes: { label: "Pult und Firmware · Console and firmware", placeholder: "SQ-5, 1.6.4" }
  - type: dropdown
    id: os_variant
    attributes: { label: "Installation", options: ["macOS", "Windows (Installer)", "Windows (portable)"] }
  - type: textarea
    id: what
    attributes: { label: "Was ist passiert? · What happened?", description: "Mit Schritten · with steps to reproduce" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "Was hättest du erwartet? · What did you expect?" }
  - type: textarea
    id: log
    attributes: { label: "Screenshot / Log", description: "Bild hier hineinziehen · drag an image here" }

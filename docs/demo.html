<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Touch Bedienung ausprobieren</title>
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#1d1d1f;--muted:#5d5d63;--line:#d9d7d0;--accent:#b8730f;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--card:#212226;--ink:#ececee;--muted:#a3a3aa;--line:#33343a;--accent:#ef9f27;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding:14px}
h1{font-size:19px;margin:0 0 2px}.lead{color:var(--muted);margin:0 0 10px;max-width:90ch}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}
.xt{background:#1b1c1f;border:1px solid #2c2d31;border-radius:10px;padding:6px}
.xt svg{width:100%;height:auto;display:block}.xt text{font-family:var(--sans)}.xt .mono{font-family:var(--mono)}
.clk{cursor:pointer}.clk:hover rect,.clk:hover circle{stroke:#ffb347}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:.35}}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.title{font-size:16px;font-weight:600;margin:0 0 6px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}dt{color:var(--muted)}dd{margin:0}
ul{margin:6px 0 0;padding-left:18px;font-size:13px}li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
#key .name{font-weight:600}#key .fn{color:var(--accent);font-weight:600}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
</style>
</head>
<body>
<h1>Bedienung ausprobieren</h1>
<p class="lead">Übungsmodell mit Beispielwerten: Taste anklicken, um zu sehen, was sie tut. Regler: Mausrad drehen, Klick = drücken. Das echte Gerät zeigt das Dashboard live.</p>
<div class="wrap">
  <div class="xt"><svg id="xt" viewBox="370 180 1630 1180" role="img" aria-label="X-Touch"></svg></div>
  <div class="side">
    <section class="card" id="key"><h2>Taste</h2><p class="hint">Taste in der Zeichnung anklicken.</p></section>
    <section class="card" id="now"></section>
    <section class="card"><h2>Schnell ausprobieren</h2><div class="chips" id="chips"></div></section>
  </div>
</div>
<script src="xtouch-draw.js"></script>
<script>
// ---------- Sprache: in der App /api/i18n, auf der Webseite i18n.json (?lang=de|en) ----------
let I18N = { lang: "de", exact: {}, rules: [] }, RULES = [];
function t(s) { if (I18N.lang !== "en" || s == null || s === "") return s; const h = I18N.exact[s]; if (h !== undefined) return h; for (const [re, to] of RULES) if (re.test(s)) return s.replace(re, to); return s; }
window.t = t;
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
const $ = (s) => document.querySelector(s);

// ---------- Beispiel-Pult ----------
const C = { RED: 1, GREEN: 2, YELLOW: 3, BLUE: 4, MAGENTA: 5, CYAN: 6, WHITE: 7 };
const LAYERS = [
	{ note: 62, code: "FS", kind: "fxsend", ch: ["FX1 Rev", "FX2 Cho", "FX3 Dly", "FX4 Hal"].map((n) => [n, C.BLUE]) },
	{ note: 63, code: "IN", kind: "input", ch: [["Kick", C.RED], ["Snare", C.RED], ["HiHat", C.GREEN], ["Tom 1", C.GREEN], ["Bass", C.BLUE], ["Gtr L", C.MAGENTA], ["Gtr R", C.MAGENTA], ["Vox", C.YELLOW]] },
	{ note: 64, code: "FR", kind: "fxreturn", ch: [["Reverb", C.MAGENTA], ["Chorus", C.MAGENTA], ["Delay", C.MAGENTA], ["Hall 2", C.MAGENTA]] },
	{ note: 65, code: "DC", kind: "dca", ch: [["Drums", C.RED], ["Bass", C.RED], ["Git", C.RED], ["Vox", C.RED], ["DCA 5", C.RED], ["DCA 6", C.RED], ["DCA 7", C.RED], ["DCA 8", C.RED]] },
	{ note: 66, code: "AU", kind: "aux", ch: [["MonL", C.CYAN], ["MonC", C.CYAN], ["MonR", C.CYAN], ["MonDr", C.CYAN], ["InEar1", C.CYAN], ["InEar2", C.CYAN], ["InEar3", C.CYAN], ["InEar4", C.CYAN]] },
	{ note: 67, code: "GR", kind: "group", ch: [["Grp 1", C.BLUE], ["Grp 2", C.BLUE]] },
	{ note: 68, code: "OU", kind: "matrix", ch: [["Mtx 1", C.MAGENTA], ["Mtx 2", C.MAGENTA], ["Mtx 3", C.MAGENTA], ["LR", C.YELLOW]] },
	{ note: 69, code: "U1", kind: "input", ch: [["Kick", C.RED], ["Snare", C.RED], ["Reverb", C.MAGENTA], ["Delay", C.MAGENTA], ["MonL", C.CYAN], ["Vox", C.YELLOW], ["Mtx 1", C.MAGENTA], ["LR", C.YELLOW]] }
];
const FNS = { input: ["Gain", "Pan", "HPF", "Trim"], fxreturn: ["Pan"], group: ["Pan"], aux: ["Pan"], matrix: ["Pan"], dca: [], fxsend: [] };
const EQ1 = ["LF Gain", "LM Gain", "HM Gain", "HF Gain", "LF Hz", "LM Hz", "HM Hz", "HF Hz"], EQ1V = ["+3.0dB", "-2.5dB", "+1.5dB", "+4.0dB", "80Hz", "350Hz", "2.20k", "9.50k"];
const EQ2 = ["LF Q", "LM Q", "HM Q", "HF Q", "HPF Hz", "", "", ""], EQ2V = ["Q 0.80", "Q 1.20", "Q 1.00", "Q 0.70", "80Hz", "", "", ""];
const GA = ["Thresh", "Depth", "Attack", "Hold", "Release", "Key HP", "Key On", ""], GAV = ["-38dB", "+20dB", "2.00ms", "50.0ms", "180ms", "120Hz", "OFF", ""];
const CO = ["Thresh", "Ratio", "Attack", "Release", "Knee", "Gain", "Detect", ""], COV = ["-18dB", "3:1", "10.0ms", "120ms", "SOFT", "+3.0dB", "RMS", ""];
const FXP = ["Predlay", "DecayTm", "HFDecay", "HFSlope", "LF Cut", "HF Cut", "", ""], FXV = ["10ms", "2.94s", "6.04k", "2.1", "400Hz", "7.10k", "", ""];
const FXNAME = ["FX1 HALL", "FX2 CHORUS", "FX3 DELAY", "FX4 HALL"];
const AUXN = ["MonL", "MonC", "MonR", "MonDr", "InEar1", "InEar2", "InEar3", "InEar4", "FX5", "FX6", "Aux 11", "Aux 12"];
const S = { layer: 1, mode: "mix", block: 0, fx: 0, sel: 1, send: null, shift: false, alt: false, fn: {}, mute: new Set([5]), pafl: new Set(), turned: Array(8).fill(0), val: {}, scene: null, nameValue: false };
const vis = () => LAYERS[S.layer].ch.map(([n, col]) => ({ n, col, kind: S.layer === 7 ? (["Reverb", "Delay"].includes(n) ? "fxreturn" : n.startsWith("Mon") ? "aux" : n.startsWith("Mtx") || n === "LR" ? "matrix" : "input") : LAYERS[S.layer].kind })).concat(Array(8).fill(null)).slice(0, 8);
const key = (c) => `${S.layer}:${c.n}`;
const fnOf = (c) => { const l = FNS[c.kind]; return l.length ? l[(S.fn[key(c)] ?? 0) % l.length] : ""; };
const baseVal = { Gain: [32, 28, 24, 30, 18, 12, 12, 20], Pan: [0, -20, 30, -10, 0, -60, 60, 0], HPF: [80, 120, 200, 90, 40, 100, 100, 110], Trim: [0, 0, 0, 0, 0, 2, 2, 0] };
const value = (c, i, f) => S.val[key(c) + f] ?? (baseVal[f] ? baseVal[f][i] : 0);
const fmt = (f, v) => f === "Pan" ? (v === 0 ? "C" : v < 0 ? `L${-v}` : `R${v}`) : f === "HPF" ? `${v}Hz` : `${v > 0 ? "+" : ""}${v.toFixed(1)}dB`;
const PUSH = { Gain: "Polarität", Pan: "Mitte", HPF: "HPF an/aus", Trim: "0 dB" };
let KEYS = {}, lastKey = null, flash = Array(8).fill(null);
const now = () => Date.now();

// ---------- Zustand → Live-Abbild wie in der App ----------
function live() {
	const ch = vis(), detail = ["eq", "plugin", "inst"].includes(S.mode), selCh = LAYERS[1].ch[S.sel] ?? LAYERS[1].ch[0];
	const top = [], bottom = [], colors = [], rings = [], faders = [], leds = {};
	const blocks = { eq: [[EQ1, EQ1V], [EQ2, EQ2V]], plugin: [[GA, GAV], [CO, COV]], inst: [[FXP, FXV]] };
	for (let i = 0; i < 8; i++) {
		const c = ch[i], fl = flash[i] && flash[i].until > now() ? flash[i].text : null;
		if (detail) { const [P, V] = blocks[S.mode][S.mode === "inst" ? 0 : S.block]; top.push(P[i]); bottom.push(fl ?? V[i]); colors.push(S.mode === "inst" ? C.BLUE : selCh[1]); rings.push(P[i] ? 0x20 + 3 + (i % 5) : 0); }
		else if (!c) { top.push(""); bottom.push(""); colors.push(0); rings.push(0); }
		else {
			top.push(c.n.slice(0, 7));
			const recent = now() - S.turned[i] < 1500;
			let f = S.send ? "Pan" : S.mode === "track" ? (S.block ? "Trim" : "Gain") : S.mode === "pan" ? "Pan" : fnOf(c);
			if (S.mode === "track" && c.kind !== "input") f = "";
			const v = f ? value(c, i, f) : 0;
			bottom.push(fl ?? (S.nameValue ? `${c.kind === "input" ? "IN" : c.kind.toUpperCase().slice(0, 3)} ${i + 1}` : f ? (recent ? fmt(f, v) : f) : ""));
			colors.push(S.send ? (S.send.k === "F" ? C.BLUE : C.CYAN) : c.col);
			rings.push(!f ? 0 : f === "Pan" ? Math.round(6 + v / 20) : 0x20 + Math.max(1, Math.min(11, Math.round(f === "HPF" ? v / 40 : (v + 10) / 6))));
		}
		faders.push(c ? (S.send ? 5000 + ((i * 1777) % 7000) : [12528, 11000, 9800, 11800, 12528, 10268, 10268, 13300][i]) : 0);
		if (c) {
			leds[i] = !detail && !S.send && S.mode === "mix" && (S.fn[key(c)] ?? 0) % Math.max(1, FNS[c.kind].length) ? "on" : "off";
			leds[8 + i] = S.pafl.has(i) ? "on" : "off"; leds[16 + i] = S.mute.has(i) ? "on" : "off"; leds[24 + i] = S.layer === 1 && S.sel === i ? "on" : "off";
		}
	}
	for (const L of LAYERS) leds[L.note] = LAYERS[S.layer] === L ? "on" : "off";
	leds[40] = S.mode === "track" ? "on" : "off"; leds[42] = S.mode === "pan" ? "on" : "off"; leds[44] = S.mode === "eq" ? "on" : "off";
	leds[43] = S.mode === "plugin" ? "on" : "off"; leds[45] = S.mode === "inst" ? "on" : "off"; leds[41] = S.send ? "on" : "off";
	if (S.send) { const n = S.send.k === "F" ? S.send.n : S.send.n <= 8 ? S.send.n : S.send.n - 4; leds[53 + n] = S.send.k === "F" || S.send.n > 8 ? "blink" : "on"; }
	leds[70] = S.shift ? "on" : "off"; leds[73] = S.alt ? "on" : "off"; leds[52] = S.nameValue ? "on" : "off"; leds[83] = S.scene ? "blink" : "off";
	const code = S.send ? (S.send.k === "F" ? "F" + S.send.n : "A" + (S.send.n > 9 ? "X" : S.send.n)) : S.mode === "mix" ? LAYERS[S.layer].code : { track: ["GN", "TR"], pan: ["PA"], eq: ["E1", "E2"], plugin: ["GA", "CO"], inst: ["P1", "P2", "P3", "P4"] }[S.mode][S.mode === "inst" ? S.fx : S.block];
	const big = S.scene ? `SZ ${S.scene} ?` : S.mode === "inst" ? FXNAME[S.fx] : S.send ? (S.send.k === "F" ? FXNAME[S.send.n - 1] : AUXN[S.send.n - 1].toUpperCase()) : `IN ${S.sel + 1} ${(LAYERS[1].ch[S.sel] ?? [""])[0].toUpperCase()}`;
	const meters = ch.map((c, i) => (c ? Math.round(3 + 3 * Math.abs(Math.sin(now() / (700 + i * 90) + i))) : 0));
	// Tasten mit modusabhängiger Wirkung (wie in der App)
	const keys = JSON.parse(JSON.stringify(KEYS)), setK = (n, label, idle) => { if (keys[n]) { keys[n].label = t(label); keys[n].idle = idle; } };
	const bc = code;
	setK(74, bc === "E1" || bc === "E2" ? "EQ an/aus" : bc === "GA" ? "Gate an/aus" : bc === "CO" ? "Comp an/aus" : "Block an/aus", !["E1", "E2", "GA", "CO"].includes(bc));
	setK(75, S.mode === "eq" ? "HPF an/aus" : S.mode === "track" ? "Pad an/aus" : "HPF/Pad", !["eq", "track"].includes(S.mode));
	setK(76, "EQ flach", S.mode !== "eq"); setK(79, "48V", S.mode !== "track");
	const sf = (c) => ({ rec: t("Regler▸"), solo: c && c.kind === "input" ? "PAFL" : "", mute: c && c.kind !== "fxsend" ? "Mute" : "", select: "Sel" });
	return { device: { top, bottom, colors, rings, faders, meters, clip: Array(8).fill(false), leds, assign: code, timecode: big }, keys, shiftHeld: S.shift, stripFns: ch.map(sf), help: { push: detail ? Array(8).fill("") : ch.map((c) => (c ? t(PUSH[S.send ? "Pan" : fnOf(c)] ?? "") : "")) } };
}

// ---------- „Jetzt aktiv“ ----------
function nowPanel() {
	const sel = (LAYERS[1].ch[S.sel] ?? [""])[0], L = LAYERS[S.layer];
	let title, knobs, keys;
	if (S.send) { const lab = S.send.k === "F" ? `FX ${S.send.n}` : `Aux ${S.send.n}`; title = `Sends auf Fader · ${S.send.k === "F" ? "FX" : "Aux"} ${S.send.n}`; knobs = "Pan des Sends"; keys = ["Fader = Sendpegel, Master = Pegel des Weges", "MUTE = Kanal-Mute", "gleiche F-Taste oder SEND = Sends aus"]; }
	else if (S.mode === "mix") { const f = [...new Set(vis().filter(Boolean).map(fnOf).filter(Boolean))]; title = `Mix · Regler = ${f.join(" / ") || "–"}`; knobs = "Funktion je Zug (unten im Display)"; keys = ["REC = Reglerfunktion dieses Zuges weiter (SHIFT + REC zurück)", "Regler drücken = Standardwert bzw. umschalten", "Display unten: Funktion, beim Drehen kurz der Wert, beim Fader kurz die dB", "Modi: Gain/Trim, Pan, EQ, Gate/Comp, FX", "F1–F8 = Sends auf Fader (SHIFT = 2. Belegung)", "USER = eigene Ebenen 1–4"]; }
	else if (S.mode === "track") { title = S.block ? "TRACK · Trim (TR)" : "TRACK · Gain (GN)"; knobs = S.block ? "Trim der 8 Kanäle" : "Gain der 8 Kanäle"; keys = S.block ? ["TRACK nochmal = zurück zu Mix"] : ["WRITE = Pad (gewählter Kanal)", "ALT + GROUP 1 s = 48V (gewählter Kanal)", "TRACK nochmal = Trim"]; }
	else if (S.mode === "pan") { title = "PAN"; knobs = "Pan des Kanals"; keys = ["PAN nochmal = zurück zu Mix"]; }
	else if (S.mode === "eq") { title = `${S.block ? "EQ · Block E2" : "EQ · Block E1"} (gewählter Kanal)`; knobs = (S.block ? EQ2 : EQ1).filter(Boolean).join(", "); keys = S.block ? ["READ = EQ an/aus", "WRITE = HPF an/aus", "EQ nochmal = zurück zu Mix, Cursor ◀ = E1"] : ["READ = EQ an/aus", "WRITE = HPF an/aus", "TRIM + ALT = alle EQ-Gains 0 dB", "EQ nochmal / Cursor ▶ = Block E2"]; }
	else if (S.mode === "plugin") { title = `${S.block ? "PLUG-IN · Compressor" : "PLUG-IN · Gate"} (gewählter Kanal)`; knobs = (S.block ? CO : GA).filter(Boolean).join(", "); keys = S.block ? ["READ = Comp an/aus", "PLUG-IN nochmal = zurück zu Mix"] : ["READ = Gate an/aus", "PLUG-IN nochmal = Compressor"]; }
	else { title = `INST · FX ${S.fx + 1}`; knobs = FXP.filter(Boolean).join(", "); keys = [S.fx < 3 ? `INST nochmal = FX ${S.fx + 2}` : "INST nochmal = FX – zurück zu Mix", "SHIFT + F1–F4 = FX direkt wählen"]; }
	keys = [...keys, "CANCEL = zurück zu Mix"];
	$("#now").innerHTML = `<h2>${t("Jetzt aktiv")}</h2><p class="title">${esc(t(title))}</p><dl><dt>${t("Ebene")}</dt><dd>${esc(L.code === "U1" ? "USER 1" : ["MIDI TRACKS", "INPUTS", "AUDIO TRACKS", "AUDIO INST", "AUX", "BUSES", "OUTPUTS", "USER"][S.layer])}</dd><dt>${t("Auswahl")}</dt><dd>${esc(sel)}</dd><dt>${t("Regler")}</dt><dd>${esc(t(knobs))}</dd></dl><ul>${keys.map((k) => `<li>${esc(t(k))}</li>`).join("")}</ul>`;
}

// ---------- Tasten ----------
const STRIP = { rec: "Reglerfunktion dieses Zuges weiter (SHIFT + REC zurück)", solo: "PAFL (Vorhören)", mute: "Mute", select: "Kanal wählen" };
function explain(note, knob) {
	let name, fn, how;
	if (knob !== undefined) { const c = vis()[knob]; name = `Encoder ${knob + 1}`; fn = c ? fnOf(c) || "–" : "–"; how = "Mausrad = drehen, Klick = drücken (Standardwert)"; }
	else if (note < 32) { const row = ["rec", "solo", "mute", "select"][note >> 3]; name = `${row.toUpperCase()} ${(note & 7) + 1}`; fn = STRIP[row]; how = "Kanaltasten: Einstellungen › Tastenbelegung › Kanaltasten"; }
	else { const k = KEYS[note]; if (!k) return; name = k.name; fn = S.shift && k.shiftFull ? k.shiftFull : k.full; how = k.shiftFull && !S.shift ? `${t("mit SHIFT")}: ${k.shiftFull}` : ""; }
	$("#key").innerHTML = `<h2>${t("Taste")}</h2><p class="name">${esc(name)}</p><p class="fn">${esc(t(fn))}</p>${how ? `<p class="hint">${esc(t(how))}</p>` : ""}`;
}
function press(note) {
	const ch = vis();
	if (note < 8) { const c = ch[note]; if (c && !S.send) { if (S.mode !== "mix") { S.mode = "mix"; S.block = 0; } const n = FNS[c.kind].length; if (n > 1) S.fn[key(c)] = ((S.fn[key(c)] ?? 0) + (S.shift ? n - 1 : 1)) % n; } }
	else if (note < 16) { const i = note - 8; if (ch[i]?.kind === "input") S.pafl.has(i) ? S.pafl.delete(i) : S.pafl.add(i); }
	else if (note < 24) { const i = note - 16; if (ch[i]) S.mute.has(i) ? S.mute.delete(i) : S.mute.add(i); }
	else if (note < 32) { if (S.layer === 1) S.sel = note - 24; }
	else if (note === 40) { if (S.mode === "track" && S.block === 0) S.block = 1; else if (S.mode === "track") { S.mode = "mix"; S.block = 0; } else { S.mode = "track"; S.block = 0; S.send = null; } }
	else if (note === 42) { S.mode = S.mode === "pan" ? "mix" : "pan"; S.block = 0; S.send = null; }
	else if (note === 44) { if (S.mode === "eq" && S.block === 0) S.block = 1; else if (S.mode === "eq") { S.mode = "mix"; S.block = 0; } else { S.mode = "eq"; S.block = 0; S.send = null; } }
	else if (note === 43) { if (S.mode === "plugin" && S.block === 0) S.block = 1; else if (S.mode === "plugin") { S.mode = "mix"; S.block = 0; } else { S.mode = "plugin"; S.block = 0; S.send = null; } }
	else if (note === 45) { if (S.mode === "inst") { if (S.fx < 3) S.fx++; else { S.mode = "mix"; S.fx = 0; } } else { S.mode = "inst"; S.fx = S.send?.k === "F" ? S.send.n - 1 : 0; } }
	else if (note === 41) { S.send = S.send ? null : { k: "A", n: 3 }; S.mode = "mix"; }
	else if (note >= 54 && note <= 61) { const n = note - 53, tgt = S.shift ? (n <= 4 ? { k: "F", n } : { k: "A", n: n + 4 }) : { k: "A", n }; const same = S.send && S.send.k === tgt.k && S.send.n === tgt.n; S.send = same ? null : tgt; if (S.mode === "inst" && tgt.k === "F") S.fx = tgt.n - 1; else S.mode = "mix"; S.shift = false; }
	else if (note >= 62 && note <= 69) { S.layer = note - 62; }
	else if (note === 70) { S.shift = !S.shift; }
	else if (note === 73) { S.alt = !S.alt; }
	else if (note === 82) { S.mode = "mix"; S.block = 0; S.send = null; S.scene = null; }
	else if (note === 96 || note === 97) { S.scene = Math.max(1, (S.scene ?? 12) + (note === 96 ? -1 : 1)); }
	else if (note === 83) { if (S.scene) S.scene = null; }
	else if (note === 98 || note === 99) { if (["eq", "plugin", "track"].includes(S.mode)) S.block = note === 99 ? 1 : 0; }
	else if (note === 52) { S.nameValue = !S.nameValue; }
	render();
}
function turn(i, d) {
	const c = vis()[i]; if (!c || ["eq", "plugin", "inst"].includes(S.mode)) return;
	const f = S.send ? "Pan" : S.mode === "track" ? (S.block ? "Trim" : "Gain") : S.mode === "pan" ? "Pan" : fnOf(c); if (!f) return;
	const lim = { Gain: [-6, 60], Pan: [-100, 100], HPF: [20, 2000], Trim: [-24, 24] }[f], step = { Gain: 1, Pan: 5, HPF: 10, Trim: 0.5 }[f];
	S.val[key(c) + f] = Math.max(lim[0], Math.min(lim[1], value(c, i, f) + d * step)); S.turned[i] = now(); render();
}
function pushKnob(i) {
	const c = vis()[i]; if (!c) return;
	const f = S.send ? "Pan" : fnOf(c); if (!f) return;
	if (f === "Pan" || f === "Trim") { S.val[key(c) + f] = 0; S.turned[i] = now(); }
	else flash[i] = { text: f === "Gain" ? "INV" : "HPF ON", until: now() + 1200 };
	render();
}

// ---------- Zeichnen ----------
function render() { drawXTouch($("#xt"), live(), { interactive: true, demo: true, selected: lastKey }); nowPanel(); }
$("#xt").addEventListener("click", (e) => {
	const k = e.target.closest("[data-knob]"); if (k) { const i = +k.dataset.knob; pushKnob(i); explain(null, i); return; }
	const g = e.target.closest("[data-note]"); if (!g) return;
	const n = +g.dataset.note; lastKey = n; explain(n); press(n);
});
$("#xt").addEventListener("wheel", (e) => { const k = e.target.closest("[data-knob]"); if (!k) return; e.preventDefault(); turn(+k.dataset.knob, e.deltaY < 0 ? 1 : -1); }, { passive: false });
$("#xt").addEventListener("keydown", (e) => { if (e.key !== "Enter" && e.key !== " ") return; const g = e.target.closest("[data-note],[data-knob]"); if (!g) return; e.preventDefault(); g.dispatchEvent(new MouseEvent("click", { bubbles: true })); });
const CHIPS = [["Monitormix Aux 3", () => { S.send = { k: "A", n: 3 }; S.mode = "mix"; }], ["Hall (FX 1)", () => { S.mode = "inst"; S.fx = 0; S.send = { k: "F", n: 1 }; }], ["EQ Snare", () => { S.layer = 1; S.sel = 1; S.mode = "eq"; S.block = 0; S.send = null; }], ["Gate", () => { S.mode = "plugin"; S.block = 0; S.send = null; }], ["Compressor", () => { S.mode = "plugin"; S.block = 1; S.send = null; }], ["REC: Pan auf Zug 1", () => { S.layer = 1; S.mode = "mix"; S.send = null; S.fn["1:Kick"] = 1; }], ["Zurück zu Mix", () => { S.mode = "mix"; S.block = 0; S.send = null; S.fn = {}; S.shift = false; }]];
function chips() { $("#chips").innerHTML = CHIPS.map((c, i) => `<button type="button" data-c="${i}">${esc(t(c[0]))}</button>`).join(""); }
$("#chips").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { CHIPS[+b.dataset.c][1](); render(); } });
function translateDom() {
	if (I18N.lang !== "en") return; document.documentElement.lang = "en"; document.title = t(document.title);
	const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
	for (let n = w.nextNode(); n; n = w.nextNode()) { if (n.parentElement?.closest("script,style,svg")) continue; const k = n.nodeValue.trim(); if (k) { const x = t(k); if (x !== k) n.nodeValue = n.nodeValue.replace(k, x); } }
}
(async () => {
	// In der App: Sprache der App; auf der Webseite: Englisch. ?lang=de|en wählt ausdrücklich.
	const want = new URLSearchParams(location.search).get("lang");
	let inApp = false;
	try { const r = await fetch("/api/i18n"); if (!r.ok) throw 0; I18N = await r.json(); inApp = true; }
	catch { try { I18N = { ...(await (await fetch("i18n.json")).json()), lang: "en" }; } catch { /* nur Deutsch */ } }
	if (want === "de" || want === "en") I18N.lang = want;
	RULES = (I18N.rules || []).map(([a, b]) => [new RegExp(a), b]);
	try { if (!inApp) throw 0; KEYS = (await (await fetch("/api/keys")).json()).keys; } catch { KEYS = await (await fetch(`keys-${I18N.lang}.json`)).json(); }
	translateDom(); chips(); render();
	setInterval(render, 250); // Pegel und kurze Werteanzeige laufen weiter
})();
</script>
